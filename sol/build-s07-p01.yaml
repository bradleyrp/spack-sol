spack:
  # CUSTOM MODULES
  # these modifications blacklist the system compiler to make Core packages
  # this streamlines the lmod tree that we expose to the users
  view: false
  concretizer: 
    unify: false
    reuse: false
  compilers:
  - compiler:
      spec: gcc@=14.2.1
      paths:
        cc: /opt/rh/gcc-toolset-14/root/usr/bin/gcc
        cxx: /opt/rh/gcc-toolset-14/root/usr/bin/g++
        f77: /opt/rh/gcc-toolset-14/root/usr/bin/gfortran
        fc: /opt/rh/gcc-toolset-14/root/usr/bin/gfortran
      flags: {}
      operating_system: almalinux9
      target: x86_64
      modules: []
      environment: {}
      extra_rpaths: []
  modules:
    # configurations for a module set
    default:
      roots:
        lmod: $spack_env/lmod
      arch_folder: true
      lmod:
        core_compilers:
        - &gcc_back !system_compiler
        - &gcc_alt gcc@14.2.1
        hierarchy:
        - compiler
        - mpi
        include:
        - gcc
        - intel-oneapi-compilers 
        exclude:
        - !cat ['%', *gcc_back]
        - !cat ['%', *gcc_alt]
        projections:
          all: '{name}/{version}'
        hash_length: 0
  # EXTERNAL packages
  packages:
    slurm:
      buildable: false
      externals:
      - spec: slurm@23.02.8
        prefix: /usr/local/slurm
    gcc:  
      externals:
      - spec: gcc@=14.2.1 
        prefix: /opt/rh/gcc-toolset-14/root/usr/
        extra_attributes:
          compilers:
            c: /opt/rh/gcc-toolset-14/root/usr/bin/gcc
            cxx: /opt/rh/gcc-toolset-14/root/usr/bin/g++
            f77: /opt/rh/gcc-toolset-14/root/usr/bin/gfortran
            fc: /opt/rh/gcc-toolset-14/root/usr/bin/gfortran
  # pack the install root with the superspec
  config:
    install_tree:
      root: /share/Apps/build/zen25v1/marianatrenchbuildsite
    # staging. defer to TMPDIR which should be carefully selected
    build_stage:
    - $TMPDIR
  # specs in a superspec format, using list of lists
  specs: 
  - - !cat
      - &gcc gcc@14.3.0 +binutils %gcc@14.2.1
      - &arch arch=linux-almalinux9-zen5
      - ^binutils@2.43.1
  - - !cat
      - &intel intel-oneapi-compilers@2025.0.0
      - *arch 
      - !spec {compiler: *gcc_alt}
