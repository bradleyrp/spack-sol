spack:
  # CUSTOM MODULES
  # these modifications blacklist the system compiler to make Core packages
  # this streamlines the lmod tree that we expose to the users
  view: false
  concretizer: 
    unify: false
    reuse: false
  modules:
    # configurations for a module set
    default:
      roots:
        lmod: $spack_env/lmod
      arch_folder: true
      lmod:
        core_compilers:
        - &gcc_back !system_compiler
        hierarchy:
        - compiler
        - mpi
        include:
        - gcc
        - intel-oneapi-compilers 
        exclude:
        - !cat ['%', *gcc_back]
        projections:
          all: '{name}/{version}'
        hash_length: 0
  # EXTERNAL packages
  packages:
    slurm:
      buildable: false
      externals:
      - spec: slurm@23.02.8
        prefix: /usr/local/slurm
  # pack the install root with the superspec
  config:
    install_tree:
      root: /share/Apps/build/haswell24v2/marianatrenchbuildsite
    # staging
    build_stage:
    - $TMPDIR
  # specs in a superspec format, using list of lists
  specs: 
  - - !cat
      - &gcc gcc@12.4.0
      - &arch arch=linux-almalinux9-haswell
      - !spec {compiler: *gcc_back}
  - - !cat
      - &intel intel-oneapi-compilers@2025.0.0
      - *arch 
      - !spec {compiler: *gcc_back}
  - - !cat
      - lmod@8.7.37 auto_swap=true build_system=autotools  
      - *arch 
      - !spec {compiler: *gcc_back}
